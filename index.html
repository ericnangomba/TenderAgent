<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="/tenderagentfavicon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#059669" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TenderAgent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>TenderAgent - South African RFP Automation Platform</title>
    <meta name="description" content="Micro-SaaS helping South African SMEs instantly analyze government and corporate RFPs for CSD, SARS, B-BBEE, and CIDB compliance and build structured bid response skeletons." />
    <meta property="og:title" content="TenderAgent - South African RFP Automation Platform" />
    <meta property="og:description" content="Micro-SaaS helping South African SMEs instantly analyze government and corporate RFPs for CSD, SARS, B-BBEE, and CIDB compliance and build structured bid response skeletons." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />

    <!-- Instant Removal & Suppression for Netlify Injected Badges and Drawers -->
    <style>
      iframe[src*="netlify"],
      div[id*="netlify"],
      div[class*="netlify"],
      [data-netlify-drawer],
      [data-netlify-badge],
      .netlify-badge,
      #netlify-badge,
      netlify-badge,
      a[href*="netlify.com/drop"],
      a[href*="utm_source=netlify_badge"],
      div:has(> a[href*="utm_source=netlify_badge"]),
      div:has(> a[href*="netlify.com/drop"]) {
        display: none !important;
        visibility: hidden !important;
        opacity: 0 !important;
        pointer-events: none !important;
        height: 0 !important;
        width: 0 !important;
        position: absolute !important;
        z-index: -9999 !important;
      }
    </style>
    <script>
      (function() {
        function purgeNetlifyBadge() {
          try {
            var selectors = [
              'iframe[src*="netlify"]',
              '[data-netlify-drawer]',
              '[data-netlify-badge]',
              '.netlify-badge',
              '#netlify-badge',
              'netlify-badge',
              'a[href*="utm_source=netlify_badge"]',
              'a[href*="netlify.com/drop"]'
            ];
            var targets = document.querySelectorAll(selectors.join(','));
            targets.forEach(function(el) {
              var parent = el.closest('div[style*="position: fixed"], div[style*="z-index"]') || el;
              if (parent && parent.parentNode) {
                parent.parentNode.removeChild(parent);
              }
            });
          } catch (e) {}
        }
        purgeNetlifyBadge();
        if (window.MutationObserver) {
          var observer = new MutationObserver(function() {
            purgeNetlifyBadge();
          });
          observer.observe(document.documentElement, { childList: true, subtree: true });
        }
        window.addEventListener('DOMContentLoaded', purgeNetlifyBadge);
        window.addEventListener('load', purgeNetlifyBadge);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
