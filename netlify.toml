[build]
  command = "npm run build"
  publish = "dist"

[build.processing]
  skip_processing = true

# API reverse proxy: the browser only ever talks to this site first-party.
# /api/* is forwarded to the private backend over its Tailscale Funnel HTTPS
# address, so session cookies stay SameSite=Lax first-party and no CORS or
# SameSite=None handling is needed.
[[redirects]]
  from = "/api/*"
  to = "https://apphosting.tail1cb332.ts.net/api/:splat"
  status = 200
  force = true

# Single Page Application (SPA) routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Security and performance headers
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"

# PWA Service Worker (must revalidate on each check)
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Content-Type = "application/javascript"

# PWA Web App Manifest
[[headers]]
  for = "/manifest.json"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
    Content-Type = "application/manifest+json"
